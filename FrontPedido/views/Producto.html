<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
    <link rel="stylesheet" href="/FrontPedido/style/style.css">
    <link rel="stylesheet" href="/Bootstrap/biblioteca bootstrap/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-4 shadow-sm p-4 bg-white rounded">

        <div class="container mb-4">
            <h1 class="mb-4">Producto</h1>

            <div class=" ">
                <div class="d-flex gap-2 mb3">
                    <select name="CategoriaID" id="CategoriaID" class="form-control">
                        <option value="">[SELECCIONE...]</option>
                    </select>
                    <input type="text" id="nombreProducto" placeholder="Ingrese nombre">
                    <input type="number" id="costoProducto" placeholder="Ingrese costo">
                    <input type="number" id="ventaProducto" placeholder="Ingrese precio">
                    <button class="btn btn-primary w-100" onclick="agregarProducto()">Guardar</button>
                </div>
            </div>
        </div>

<!-- Modal -->
        <div class="modal fade" id="editarProducto" tabindex="-1" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">

                        <input type="hidden" id="idEditarProducto">
                        <input type="text" id="nombreEditarProducto" placeholder="Ingrese nuevo Nombre">
                        <input type="number" id="costoEditarProducto" placeholder="Ingrese nuevo Costo">
                        <input type="number" id="precioEditarProducto" placeholder="Ingrese nuevo Precio">

                    </div>
                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="EditarCategoria()">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

<!-- Tabla -->
        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Costo</th>
                    <th scope="col">Precio</th>
                </tr>
            </thead>
            <tbody id="tablaProducto">

            </tbody>
        </table>

    </div>


    <script src="/Bootstrap/biblioteca bootstrap/js/bootstrap.min.js"></script>
    <script src="/js/Producto1.0.0.js"></script>
</body>

</html>
