<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/Bootstrap/biblioteca bootstrap/css/bootstrap.min.css">
</head>

<body class="bg-success">

    <div class="container mt-4 shadow-sm p-4 bg-white rounded">
        <div class="row ">
            <div class="col-6">
                <h1 class="mb-4 text-success">Gestión de Pedido</h1>
            </div>
            <div class="col-4">
                <button class="btn btn-primary m-2 fw-bold" onclick="location.href='Categoria.html'">Categoría</button>
                <button class="btn btn-danger m-2 fw-bold" onclick="location.href='Producto.html'">Producto</button>
            </div>
        </div>

        <div class="row mb-4">
            <h4 class="mb-4">Nuevo Pedido</h4>

            <div class="row mb-4">

                <div class="col-md-3">
                    <label class="form-label">Nombre Cliente</label>
                    <input type="text" class="form-control" id="nombre">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" id="fecha">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Estado</label>
                    <select class="form-control" id="estado">
                        <option value="0">Pendiente</option>
                        <option value="1">Enviado</option>
                        <option value="2">Entregado</option>
                    </select>
                </div>
            </div>

            <h4>Detalle del pedido</h4>
            <div class="row mb-4 align-items-end mt-3">
                <div class="col-md-4 mb-3 mb-md-0">
                    <label class="form-label">Producto</label>
                    <select class="form-control bg-light" id="producto" onchange="cargarPrecio()">
                        <option value="">[SELECCIONE...]</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3 mb-md-0">
                    <label class="form-label">Cantidad</label>
                    <input type="number" class="form-control bg-light" id="cantidad" placeholder="Ingrese Cantidad...">
                </div>
                <div class="col-md-3 mb-3 mb-md-0">
                    <label class="form-label">Precio Unitario</label>
                    <input type="number" id="precioUnitario" class="form-control bg-light" step="0.01"
                        placeholder="Ingrese Precio..." readonly>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-primary w-100 fw-bold" onclick="AgregarDetalle()">
                        Agregar
                    </button>
                </div>
            </div>

            <!-- tabla detalle memoria -->
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover table-success text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Producto</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Precio Unitario</th>
                            <th scope="col">Subtotal</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody id="tablaDetalles">

                    </tbody>
                </table>
            </div>

            <!-- BOTÓN CREAR -->
            <div class="mb-4">
                <button type="button" class="btn btn-success fw-bold" onclick="CrearPedido()">
                    Crear Pedido
                </button>
                <div class="mt-3">
                    <h5>Total: <span id="total"></span></h5>
                </div>
            </div>

            <hr>

            <!-- PEDIDOS GUARDADOS -->
            <h4 class="mb-4 mt-4">Pedidos Anteriores</h4>
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover table-success text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre del cliente</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Total</th>
                            <th>Detalles</th>
                        </tr>
                    </thead>
                    <tbody id="TablaPedido">

                    </tbody>
                </table>
            </div>

            <!-- Modal -->
            <div class="modal fade" id="mostrarDetallesModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header bg-warning">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Detalles del Pedido</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body bg-light row m-0">

                            <input type="hidden" id="idPedidoModal">
                            <div class="table-responsive">
                                <table
                                    class="table table-bordered table-striped table-hover table-success text-center align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th scope="col">Producto</th>
                                            <th scope="col">Cantidad</th>
                                            <th scope="col">Precio Unitario</th>
                                            <th scope="col">Subtotal</th>
                                            <th scope="col"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaDetallesModal">

                                    </tbody>
                                </table>
                            </div>

                        </div>

                        <div class="modal-footer bg-light">
                            <button type="button" class="btn btn-secondary fw-bold"
                                data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="/js/Pedido1.0.0.js"></script>
    <script src="/Bootstrap/biblioteca bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
